name: Renovate

on:
  schedule:
    - cron: '0 4 * * 1' # every Monday at 04:00 UTC
  workflow_dispatch:
  issues:
    types: [edited]

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    # Always run on schedule / manual trigger.
    # On issue edits: only fire when a checkbox in the Renovate Dependency
    # Dashboard is checked (the dashboard issue is authored by renovate[bot]).
    if: |
      github.event_name != 'issues' ||
      (
        github.event.issue.user.login == 'renovate[bot]' &&
        contains(github.event.issue.body, '- [x]')
      )
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # RENOVATE_TOKEN: fine-grained PAT scoped to this repository only
      # Required permissions: contents (read+write), pull-requests (read+write)
      - uses: renovatebot/github-action@eb932558ad942cccfd8211cf535f17ff183a9f74 # v46
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: "renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>"
