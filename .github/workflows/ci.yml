name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history required so git diff can compare against base commits.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up environment
        run: cp .env.example .env

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Functional e2e tests
        run: pnpm test:e2e:functional

      - name: Detect affected visual routes
        id: affected
        env:
          # On PRs use the PR base; on push use the before-SHA; fall back to HEAD~1.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: node --experimental-strip-types scripts/affected-routes.ts "$BASE_SHA"

      - name: Visual regression
        if: steps.affected.outputs.run == 'true'
        env:
          VISUAL_GREP: ${{ steps.affected.outputs.grep }}
        run: |
          if [ -n "$VISUAL_GREP" ]; then
            pnpm test:e2e:visual --grep "$VISUAL_GREP"
          else
            pnpm test:e2e:visual
          fi

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shiplight-report
          path: shiplight-report/
          retention-days: 7
