name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required so git diff can compare against base commits.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up environment
        run: cp .env.example .env

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Functional e2e tests
        run: pnpm test:e2e:functional

      - name: Detect affected visual routes
        id: affected
        env:
          # On PRs use the PR base; on push use the before-SHA; fall back to HEAD~1.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: node --experimental-strip-types scripts/affected-routes.ts "$BASE_SHA"

      - name: Visual regression
        if: steps.affected.outputs.run == 'true'
        env:
          VISUAL_GREP: ${{ steps.affected.outputs.grep }}
        run: |
          if [ -n "$VISUAL_GREP" ]; then
            pnpm test:e2e:visual --grep "$VISUAL_GREP"
          else
            pnpm test:e2e:visual
          fi
        continue-on-error: true

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
